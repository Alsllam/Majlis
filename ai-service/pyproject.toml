[project]
name = "majlis-ai-service"
version = "0.1.0"
description = "Majlis AI service: the shared agent, RAG and tools. The only component that talks to models."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "openai>=3.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "aio-pika>=10.1",
    "pyjwt[crypto]>=2.15",
    "structlog>=26.1",
    "tenacity>=9.2",
    "httpx>=0.28",
    "azure-identity>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "fakeredis>=2.39",
    "mypy>=2.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "S", "RUF", "PL", "PT", "TRY", "LOG"]
ignore = ["PLR0913", "TRY003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
